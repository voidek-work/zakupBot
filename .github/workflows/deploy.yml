name: CI & CD Deploy to Server

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  # 1. Continuous Integration (TypeCheck & Automated Tests)
  test:
    name: 🧪 Run Tests & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🗄️ Generate Prisma Client
        run: npx prisma generate

      - name: 🔍 Type Check (TypeScript)
        run: npx tsc --noEmit

      - name: 🧪 Run Vitest Test Suite
        run: npm test

      - name: 🏗️ Production Build Check
        run: npm run build

  # 2. Continuous Deployment (SSH Deploy to Server & PM2 Reload)
  deploy:
    name: 🚀 Deploy to Server via PM2
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 🚀 Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 Starting deployment on remote server..."
            
            # Navigate to project directory
            cd ${{ secrets.PROJECT_PATH || '/var/www/zakupBot' }}
            
            # Pull latest changes from git
            echo "📥 Pulling latest git changes..."
            git fetch origin
            git reset --hard origin/${{ github.ref_name }}
            
            # Install/update dependencies
            echo "📦 Installing npm dependencies..."
            npm ci
            
            # Generate Prisma Client & Push DB schema changes
            echo "🗄️ Updating Prisma database schema..."
            npx prisma generate
            npx prisma db push --skip-generate
            
            # Build TypeScript to production bundle
            echo "🏗️ Building application..."
            npm run build
            
            # Restart/Start via PM2
            echo "🤖 Reloading PM2 process..."
            if npx pm2 describe zakup-bot > /dev/null 2>&1; then
              npm run pm2:restart
            else
              npm run pm2:start
            fi
            
            # Save PM2 state for system reboot persistence
            npx pm2 save
            
            echo "✅ Deployment completed successfully!"
